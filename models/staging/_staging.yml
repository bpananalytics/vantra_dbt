version: 2

models:

  # ============================================================
  # stg_orders — cleaned orders from core.main
  # ============================================================
  - name: stg_orders
    description: >
      Cleaned orders from core.main. Exact duplicates removed (108,127 → 108,031 rows),
      dates parsed, product names standardized, brand derived, prices cast to NUMERIC,
      and questionable rows flagged rather than deleted.
    columns:

      # ---------- IDs ----------
      - name: order_id
        description: >
          Order identifier. About 770 IDs were corrupted to scientific notation by
          Excel and are unrecoverable. 5 orders appear twice, differing only by refund date.
        data_tests:
          - not_null

      - name: user_id
        description: >
          Customer identifier (8-character hex). 599 rows (483 IDs) were converted to
          scientific notation by Excel (e.g. 1.76E+08) and the original IDs are unrecoverable.
          The corrupted value is mostly consistent per customer (only 2 known IDs mix
          customers), so these rows are kept and remain usable for customer-level analysis.
        data_tests:
          - not_null

      - name: country_code
        description: >
          Customer country code from IP geolocation. Includes non-country codes
          EU, AP, and A1. Some orders have no code (warn, not fail).
        data_tests:
          - not_null:
              config:
                severity: warn

      # ---------- Dates ----------
      - name: purchase_date
        description: >
          Date of purchase. Parsed from three source formats (m/d/yyyy,
          m/d/yyyy h:mm, Excel serial numbers). 3 values null on purpose
          (blank, whitespace, '/N').
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: ship_date
        description: Date the order shipped.
        data_tests:
          - not_null

      - name: delivery_date
        description: Date the order was delivered.
        data_tests:
          - not_null

      - name: refund_date
        description: Date the order was refunded. Null if not refunded.

      - name: account_created_date
        description: Date the customer's account was created.
        data_tests:
          - not_null

      # ---------- Prices ----------
      - name: usd_price
        description: Order price in USD, cast to NUMERIC for exact cents. 33 values are null (unknown, not zero).
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: local_price
        description: Order price in the customer's local currency, cast to NUMERIC.
        data_tests:
          - not_null

      - name: currency
        description: Currency code for local_price. 54 values are null; not used in analysis (USD only).
        data_tests:
          - not_null:
              config:
                severity: warn

      # ---------- Categories ----------
      - name: product_name
        description: >
          Product name, standardized from 9 source variants to 8 (the monitor's
          two spellings merged). Title-cased; brand styling not preserved.
          Use this (not the dropped product_id) as the product key.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Thinkpad Laptop'
                  - 'Samsung Webcam'
                  - 'Apple Airpods Headphones'
                  - '27in 4K Gaming Monitor'
                  - 'Apple Iphone'
                  - 'Samsung Charging Cable Pack'
                  - 'Macbook Air Laptop'
                  - 'Bose Soundsport Headphones'

      - name: brand
        description: >
          Brand derived from product_name. The monitor has no brand in its name,
          so it is labeled 'Generic'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Apple'
                  - 'Samsung'
                  - 'Lenovo'
                  - 'Bose'
                  - 'Generic'

      - name: purchase_platform
        description: Platform the order was placed on (website or mobile app).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'website'
                  - 'mobile app'

      - name: marketing_channel
        description: >
          Marketing channel that brought the customer in. Null means channel not
          recorded (1,469 rows, including 82 source values of 'unknown').
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'direct'
                  - 'email'
                  - 'affiliate'
                  - 'social media'

      - name: account_creation_method
        description: How the customer's account was created.

      # ---------- Flags ----------
      - name: is_zero_price
        description: True when usd_price is 0 (158 orders).
        data_tests:
          - not_null

      - name: is_missing_price
        description: True when usd_price is null (33 orders).
        data_tests:
          - not_null

      - name: is_refunded
        description: True when the order has a refund date.
        data_tests:
          - not_null

      - name: is_loyalty_member
        description: True when the customer is in the loyalty program (source value '1').

      - name: is_ship_before_purchase
        description: True when ship date is before purchase date (15 orders).
        data_tests:
          - not_null