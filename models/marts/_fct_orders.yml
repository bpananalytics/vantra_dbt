version: 2

models:
  - name: fct_orders
    description: >
      One row per order and refund date, enriched with region from dim_countries.
      Intentionally wide for BigQuery. Orders without a matching country are kept
      (left join) with a null region.
    config:
      materialized: table
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - refund_date
    columns:

      - name: order_id
        data_type: string
        description: >
          Order identifier. Not unique on its own: 5 orders appear twice, differing
          only by refund date. About 770 IDs were corrupted to scientific notation
          by Excel and are unrecoverable.
        data_tests:
          - not_null

      - name: user_id
        data_type: string
        description: Customer identifier. About 600 IDs were corrupted by Excel and are unrecoverable.

      - name: product_id
        data_type: string
        description: Product identifier.

      - name: purchase_date
        data_type: date
        description: >
          Date of purchase. Parsed from three source formats (m/d/yyyy,
          m/d/yyyy h:mm, Excel serial numbers). 3 values are null on purpose
          (blank, whitespace, '/N').

      - name: ship_date
        data_type: date
        description: Date the order shipped.

      - name: delivery_date
        data_type: date
        description: Date the order was delivered.

      - name: refund_date
        data_type: date
        description: Date the order was refunded. Null if the order was not refunded.

      - name: account_created_date
        data_type: date
        description: Date the customer's account was created.

      - name: product_name
        data_type: string
        description: >
          Product name, standardized from 9 source variants to 8 products.
          Title-cased for consistency; brand styling (e.g. iPhone) is not preserved.

      - name: usd_price
        data_type: numeric
        description: Order price in USD, stored as NUMERIC for exact cents. 33 values are null (unknown, not zero).

      - name: local_price
        data_type: numeric
        description: Order price in the customer's local currency, stored as NUMERIC.

      - name: currency
        data_type: string
        description: Currency code for local_price.

      - name: purchase_platform
        data_type: string
        description: Platform the order was placed on (website or mobile app).

      - name: marketing_channel
        data_type: string
        description: Marketing channel that brought the customer in.

      - name: account_creation_method
        data_type: string
        description: How the customer's account was created.

      - name: country_code
        data_type: string
        description: >
          Customer country code from IP geolocation. EU, AP, and A1 are
          geolocation codes (Europe, Asia/Pacific, anonymous proxy), not countries,
          and are left without a region. 140 orders have no country code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_code
              config:
                where: "country_code not in ('EU', 'AP', 'A1')"

      - name: region
        data_type: string
        description: >
          Sales region from dim_countries (APAC, EMEA, LATAM, NA). Null for
          geolocation codes and missing country codes (~0.15% of orders).

      - name: is_zero_price
        data_type: boolean
        description: True when usd_price is 0 (158 orders).

      - name: is_missing_price
        data_type: boolean
        description: True when usd_price is null (33 orders).

      - name: is_refunded
        data_type: boolean
        description: True when the order has a refund date.

      - name: is_loyalty_member
        data_type: boolean
        description: True when the customer is in the loyalty program.
      
      - name: is_ship_before_purchase
        data_type: boolean
        description: True when logged as shipped before purchase 